name: Feature request
description: Describe a caller need or an improvement to the Python client.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the use case with synthetic examples. Do not include credentials,
        tenant addresses, customer information, production responses or vendor
        documentation you do not have permission to redistribute.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Explain what a caller needs to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe the result you would like. A small synthetic usage example can help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Optional workarounds, tradeoffs or other approaches you considered.
