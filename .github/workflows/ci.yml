name: Client CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Install wheel and run isolated smoke check
        run: |
          python -m venv "$RUNNER_TEMP/foldr-install"
          "$RUNNER_TEMP/foldr-install/bin/python" -m pip install dist/*.whl pytest
          "$RUNNER_TEMP/foldr-install/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/foldr-install/bin/python" "$GITHUB_WORKSPACE/tests/package_smoke.py"
          "$RUNNER_TEMP/foldr-install/bin/python" -m pytest "$GITHUB_WORKSPACE/tests"
      - name: Build wheel from source distribution
        run: |
          mkdir "$RUNNER_TEMP/foldr-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/foldr-sdist"
          python -m build --wheel "$RUNNER_TEMP/foldr-sdist/foldr_client-0.1.0"
