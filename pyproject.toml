[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "foldr-client"
version = "0.1.0"
description = "A thin standalone client for the Foldr API v1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Selectec"}]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "oauthlib>=3.2.2,<5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/Selectec/foldr-client-python"
Documentation = "https://github.com/Selectec/foldr-client-python#readme"
Issues = "https://github.com/Selectec/foldr-client-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/foldr_client"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/docs", "/README.md", "/pyproject.toml", "/LICENSE",
  "/CONTRIBUTING.md", "/SECURITY.md", "/CODE_OF_CONDUCT.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
